[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-risk-fraud-platform"
version = "0.1.0"
description = "Production-grade financial risk and fraud detection data platform on GCP"
authors = [{ name = "Dhruv Pratap Singh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"

# ── Core runtime dependencies ─────────────────────────────────────────────────
dependencies = [
    # Data generation
    "faker>=24.0.0",
    "numpy>=1.26.4",
    "pandas>=2.2.1",

    # Apache Beam (includes DirectRunner; DataflowRunner needs gcp extra)
    "apache-beam[gcp]>=2.55.0",

    # Google Cloud SDKs
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-auth>=2.29.0",

    # FastAPI (Cloud Run ingestion API)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",

    # Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.29",

    # Data quality
    "great-expectations>=0.18.15",

    # Airflow (installed separately via Astronomer; listed here for reference)
    # "apache-airflow>=2.8.0",  # managed by astro dev

    # ML (Phase 13)
    "scikit-learn>=1.4.2",
    "xgboost>=2.0.3",
    "joblib>=1.4.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "rich>=13.7.1",
    "click>=8.1.7",
    "tenacity>=8.3.0",
    "pyarrow>=15.0.2",
    "orjson>=3.10.3",
    
    # Dashboard (Phase 12 / 23)
    "streamlit>=1.33.0",
    "plotly>=5.21.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.6",
    "apache-beam[test]>=2.55.0",

    # Linting & formatting
    "ruff>=0.4.2",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",

    # Type stubs for GCP
    "google-cloud-bigquery-storage>=2.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ingestion*",
    "pipelines*",
    "transformations*",
    "data_quality*",
    "fraud*",
    "cloud_run*",
    "monitoring*",
]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml -v"
norecursedirs = [".venv", ".git", "__pycache__", "dist", "build"]
